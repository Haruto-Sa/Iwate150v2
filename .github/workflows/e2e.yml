name: E2E

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: playwright (${{ matrix.project }}, ${{ matrix.shard }}/${{ matrix.total }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, shard: 1, total: 1 }
          - { project: screenshots, shard: 1, total: 1 }
          - { project: webkit-ui, shard: 1, total: 2 }
          - { project: webkit-ui, shard: 2, total: 2 }
          - { project: iphone, shard: 1, total: 1 }
          - { project: android, shard: 1, total: 1 }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # bun.lockのPlaywrightと揃え、毎回のOS依存ダウンロードを避ける。
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global bun@1.3.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }} --workers=1
      - name: Upload E2E diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  playwright-required:
    name: playwright
    needs: playwright
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every browser project to pass
        env:
          MATRIX_RESULT: ${{ needs.playwright.result }}
        run: test "$MATRIX_RESULT" = success
