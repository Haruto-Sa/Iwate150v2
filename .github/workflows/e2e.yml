name: E2E

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: playwright (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, screenshots, webkit-ui, iphone, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # bun.lockのPlaywrightと揃え、毎回のOS依存ダウンロードを避ける。
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global bun@1.3.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright test --project=${{ matrix.project }} --workers=1
      - name: Upload E2E diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
