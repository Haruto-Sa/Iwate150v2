name: E2E

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # bun.lockのPlaywrightと揃え、毎回のOS依存ダウンロードを避ける。
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global bun@1.3.4
      - run: bun install --frozen-lockfile
      - name: Run Playwright (retry only a transient Google font loader failure)
        shell: bash
        run: |
          set -o pipefail
          if bunx playwright test --project=chromium --project=screenshots --project=webkit-ui --project=iphone --project=android 2>&1 | tee playwright-first-attempt.log; then
            exit 0
          fi
          # Known intermittent next/font Google CSS parsing failure in CI.
          # Do not retry or suppress failing browser assertions.
          if grep -Fq 'An error occurred in `next/font`.' playwright-first-attempt.log &&
             grep -Fq "Cannot read properties of null (reading '1')" playwright-first-attempt.log; then
            echo "Retrying after transient next/font loader failure."
            bunx playwright test --project=chromium --project=screenshots --project=webkit-ui --project=iphone --project=android
          else
            exit 1
          fi
      - name: Upload E2E diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
